<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ config.gateway.name }} · HomeKit One</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --card: #fff; --text: #17181c; --muted: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --ok: #047857; --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --card: #1a1d24; --text: #e8eaee; --muted: #9aa3b2;
              --line: #2a2f3a; --accent: #6ea8fe; --ok: #34d399; --bad: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
           background: var(--bg); color: var(--text); }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    nav { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 18px; align-items: center; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
    nav a:hover, nav a.active { color: var(--accent); }
    nav .brand { color: var(--text); font-weight: 700; margin-right: 8px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    h2 { font-size: 17px; margin: 26px 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 13px; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .chip { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 999px;
            background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 12px; }
    input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--card); color: var(--text); min-width: 0; min-height: 38px; }
    form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .actions > form { display: flex; align-items: flex-end; }
    .actions.secondary { align-items: center; margin-top: 12px; padding-top: 10px;
                         border-top: 1px dashed var(--line); }
    button { white-space: nowrap; }
    label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
             background: var(--card); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    button.danger { color: var(--bad); }
    .qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; }
    .code { font: 600 22px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; }
    .notice { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--card); border-radius: 6px; }
    .banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
              border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 12px;
              padding: 12px 16px; margin-bottom: 18px;
              background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
             list-style: none; padding: 0; margin: 0 0 18px; counter-reset: step; }
    .steps li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .steps li strong { display: block; }
    .steps li span { color: var(--muted); font-size: 13px; }
    .steps li::before { counter-increment: step; content: counter(step); display: inline-grid; place-items: center;
                        width: 22px; height: 22px; border-radius: 999px; margin-bottom: 6px;
                        background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
                        font-weight: 700; font-size: 12px; }
    .report { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px;
              background: color-mix(in srgb, var(--accent) 4%, var(--card)); }
    .report.ok { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
    .report.warn { border-color: #d97706; }
    .report.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
    .report p { margin: 4px 0; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
            background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
    .pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .pill.warn { background: color-mix(in srgb, #d97706 16%, transparent); color: #b45309; }
    .pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    summary:hover { color: var(--accent); }
    a.button { display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
               background: var(--card); color: var(--text); text-decoration: none; }
    a.button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    button.small { padding: 4px 9px; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    .allow-list { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
                  display: grid; gap:6px; }
    .allow-list label.check { display: flex; gap: 8px; align-items: center; color: var(--text);
                              font-size: 14px; }
    .allow-list input[type="checkbox"] { width: 16px; height: 16px; }
    .reading-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .reading { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px;
               border: 1px solid var(--line); border-radius: 10px; }
    .control-list { display: grid; gap: 8px; }
    .control-row { display: flex; gap: 12px; align-items: center; justify-content: space-between;
                   flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .control-row:last-child { border-bottom: 0; }
    #toast { position: fixed; right: 20px; bottom: 20px; z-index: 1000; display: none;
             max-width: min(420px, calc(100vw - 40px)); padding: 12px 16px; border-radius: 10px;
             box-shadow: 0 8px 30px rgba(0,0,0,.18); background: var(--card); color: var(--text);
             border: 1px solid var(--line); font-size: 14px; }
    #toast.ok { border-color: var(--ok); }
    #toast.bad { border-color: var(--bad); }
    button:disabled { opacity: .65; cursor: progress; }
    @media (max-width: 640px) { th:nth-child(3), td:nth-child(3) { display: none; } }
  </style>
</head>
<body>
<header>
  <nav>
    <span class="brand">{{ config.gateway.name }}</span>
    <a href="/">设备</a>
    <a href="/setup">配置</a>
    <a href="/pairing">HomeKit</a>
    <a href="/logs">日志</a>
    <span style="flex:1"></span>
    <span class="muted" style="font-size:13px">HomeKit One</span>
  </nav>
</header>
<main>
  {% if setup_dirty %}
  <div class="banner">
    <div>
      <strong>配置已保存，等待重启。</strong>
      <span class="muted">新账号或设备需要重启网关后才会加载；前台运行时重启会退出进程。</span>
    </div>
    <button class="primary" type="button" onclick="homekitOneRestart(this)">立即重启</button>
  </div>
  {% endif %}
  {% if message %}<p class="notice ok">{{ message }}</p>{% endif %}
  {% if error %}<p class="notice bad">{{ error }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<div id="toast" role="status"></div>
<script>
function homeoneToast(message, isError) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message || (isError ? "操作失败" : "已保存");
  toast.className = isError ? "bad" : "ok";
  toast.style.display = "block";
  clearTimeout(window.__homeoneToastTimer);
  window.__homeoneToastTimer = setTimeout(() => { toast.style.display = "none"; }, 4200);
}

async function refreshPartial(selector) {
  const current = document.querySelector(selector);
  if (!current) return;
  const y = window.scrollY;
  try {
    const response = await fetch(window.location.href, { headers: { "X-HomeOne-Partial": "1" } });
    const text = await response.text();
    const doc = new DOMParser().parseFromString(text, "text/html");
    const fresh = doc.querySelector(selector);
    if (fresh) {
      current.innerHTML = fresh.innerHTML;
      initAjaxForms();
      window.scrollTo(0, y);
    }
  } catch (err) {
    console.warn("partial refresh failed", err);
  }
}

function initAjaxForms() {
  document.querySelectorAll("form.ajax").forEach((form) => {
    if (form.dataset.ajaxBound) return;
    form.dataset.ajaxBound = "1";
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      const original = button ? button.textContent : "";
      if (button) { button.disabled = true; button.textContent = "处理中…"; }
      try {
        const response = await fetch(form.action, {
          method: form.method || "POST",
          body: new FormData(form),
          headers: { "X-HomeOne-Ajax": "1" },
        });
        const data = await response.json().catch(() => ({
          ok: false,
          error: "服务器返回了非 JSON 响应",
        }));
        if (!response.ok && !data.error) {
          data.error = data.detail || "请求失败";
        }
        if (data.error) {
          homeoneToast(data.error, true);
          return;
        }
        homeoneToast(data.message || "已保存", false);
        const target = form.dataset.partial
          || (document.querySelector("#setup-content") ? "#setup-content" : null)
          || (document.querySelector("#device-content") ? "#device-content" : null);
        if (target) await refreshPartial(target);
      } catch (err) {
        homeoneToast("请求失败: " + err, true);
      } finally {
        if (button) { button.disabled = false; button.textContent = original; }
      }
    });
  });
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initAjaxForms);
} else {
  initAjaxForms();
}

async function homekitOneRestart(button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "重启中…";
  try { await fetch("/api/restart", {method: "POST"}); } catch (err) { /* process may exit */ }
  setTimeout(() => { location.href = "/"; }, 1500);
  setTimeout(() => { button.disabled = false; button.textContent = label; }, 6000);
}
</script>
</body>
</html>
