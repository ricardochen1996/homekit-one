[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homekit-one"
version = "0.1.0"
description = "HomeKit One: local-first HomeKit gateway for Mijia and Treeow devices on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HomeKit One contributors" }]
dependencies = [
  "HAP-python[QRCode]>=5.0.0",
  "aiohttp>=3.9",
  "cryptography>=42",
  "fastapi>=0.110",
  "httpx>=0.27",
  "jinja2>=3.1",
  "micloud>=0.6",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "tomli-w>=1.0",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
homekit-one = "homekit_one.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homekit_one"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
