# Copy to ~/.config/homekit-one/config.toml (or pass --config) and edit.
# Credentials can live here, in secrets.json (managed by the web UI), or in
# environment variables. Environment variables win over this file.
#
# Most people do not need to edit this file: start the gateway and use the web
# setup page (http://127.0.0.1:8080/setup). It saves credentials to
# secrets.json, verifies them immediately, lists devices, and flips the
# matching provider's `enabled` flag. Use this file for allow-lists, poll
# intervals and other advanced options.

[gateway]
name = "HomeKit One"
# The web UI binds to loopback by default. Change to 0.0.0.0 only if you
# understand that anyone on your LAN can then reconfigure the gateway.
web_host = "127.0.0.1"
web_port = 8080
homekit_port = 51234
# Optional: advertise a specific LAN address to HomeKit. By default the
# physical LAN interface is detected, which avoids VPN/utun addresses.
# homekit_address = "192.168.1.20"
# Extra feature switches: minimal (recommended), auto, all, or none.
# minimal keeps HomeKit to native services + readings; extra switches are only
# exposed for lights and thermostats. Everything else stays configurable in the
# gateway web UI.
extra_switches = "minimal"
# Leave empty to generate and persist a pincode on first start.
# homekit_pincode = "031-45-678"
log_level = "INFO"
# state_dir = "~/Library/Application Support/HomeKit One"

[gateway.poll_intervals]
mijia = 5
treeow = 8
fake = 30

# Demo provider. Enabled automatically when no real provider is configured.
[providers.fake]
enabled = false

[providers.mijia]
enabled = false
poll_interval = 5

# Devices can also be added from the web UI; they are stored in
# $STATE_DIR/devices.json and merged with this list.
[[providers.mijia.devices]]
id = "0x12345678"
name = "客厅净化器"
model = "zhimi.airpurifier.rma1"
host = "192.168.1.20"
# Prefer secrets.json or HOMEKIT_ONE_MIJIA_TOKEN_0X12345678 instead of committing a token.
# token = "PASTE_32_HEX_TOKEN_HERE"

# Xiaomi cloud provider. Use this for hub sub-devices (Zigbee / BLE Mesh)
# that have no LAN token/IP. Requires a Xiaomi account and internet.
# The account region must match where the devices were registered.
[providers.mijia_cloud]
enabled = false
poll_interval = 15
country = "cn"
# username = "you@example.com"
# password = "..."
# Optional allow-list of Xiaomi device ids (did). Empty means all.
# devices = ["1234567890"]

[providers.treeow]
enabled = false
poll_interval = 8
# account = "13800000000"
# Optional allow-list of device serials. Empty means all devices on the account.
# devices = ["T2PRO-XXXXXXXX"]
