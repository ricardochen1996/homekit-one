<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">HomeKit One runtime architecture</title>
  <desc id="archDesc">Apple HomeKit clients talk to the HomeKit bridge. The device manager coordinates polling and commands. Provider plugins translate Mijia LAN, Mijia Cloud, Treeow and third-party protocols into a shared DeviceKind and Capability vocabulary. A local web UI configures everything.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #64748b; }
      .card-title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .card-sub { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .tiny { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; }
      .label { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; }
      .foot { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1160" height="740" fill="#ffffff"/>

  <text x="40" y="44" class="title">HomeKit One — runtime architecture</text>
  <text x="40" y="68" class="subtitle">One process, one asyncio event loop. Providers translate protocols; HomeKit speaks one small vocabulary.</text>

  <!-- Apple clients -->
  <rect x="340" y="92" width="480" height="56" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="580" y="116" text-anchor="middle" class="card-title" fill="#3730a3">iPhone · iPad · Mac · Siri · Home App</text>
  <text x="580" y="136" text-anchor="middle" class="card-sub" fill="#4f46e5">Apple HomeKit clients</text>
  <text x="592" y="172" class="label">HAP · mDNS discovery · TCP 51234</text>

  <!-- Gateway process -->
  <rect x="40" y="188" width="1080" height="356" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="1056" y="217" text-anchor="end" class="card-title" font-size="13" fill="#334155">homekit-one <tspan class="label" font-weight="400">· single process · single asyncio event loop</tspan></text>

  <!-- Core column -->
  <rect x="80" y="240" width="280" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="100" y="267" class="card-title" fill="#1d4ed8">HomeKitBridge</text>
  <text x="100" y="289" class="card-sub">HAP-python · bridge + accessories</text>
  <text x="100" y="308" class="card-sub">pairing · QR code · accessory state</text>

  <rect x="440" y="240" width="280" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="460" y="267" class="card-title" fill="#0f172a">DeviceManager</text>
  <text x="460" y="289" class="card-sub">polling · command serialization</text>
  <text x="460" y="308" class="card-sub">optimistic update · rollback</text>

  <rect x="800" y="240" width="280" height="92" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="820" y="267" class="card-title" fill="#b45309">Web UI / REST</text>
  <text x="820" y="289" class="card-sub">FastAPI + Jinja2 · 127.0.0.1</text>
  <text x="820" y="308" class="card-sub">setup · devices · logs · pairing</text>

  <!-- HAP route -->
  <polyline points="580,148 580,202 220,202 220,232" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Core links -->
  <line x1="364" y1="286" x2="436" y2="286" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="279" text-anchor="middle" class="label">accessory I/O</text>
  <line x1="724" y1="286" x2="796" y2="286" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="760" y="279" text-anchor="middle" class="label">REST</text>

  <!-- Provider bus -->
  <text x="64" y="362" class="card-title" font-size="12.5" fill="#0f172a">Provider plugins
    <tspan font-weight="400" fill="#64748b"> · list_devices() → refresh() → execute()</tspan>
  </text>
  <text x="592" y="362" class="label">Capability / Command</text>
  <line x1="580" y1="332" x2="580" y2="382" stroke="#64748b" stroke-width="1.5"/>
  <line x1="205" y1="382" x2="1021" y2="382" stroke="#64748b" stroke-width="1.5"/>
  <line x1="205" y1="382" x2="205" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="477" y1="382" x2="477" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="749" y1="382" x2="749" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1021" y1="382" x2="1021" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Providers -->
  <rect x="80" y="406" width="250" height="96" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="100" cy="428" r="4" fill="#059669"/>
  <text x="112" y="433" class="card-title" fill="#065f46">Mijia LAN
    <tspan font-size="9.5" font-weight="600" fill="#34d399"> built-in</tspan>
  </text>
  <text x="100" y="457" class="card-sub">miIO / MIoT · UDP 54321</text>
  <text x="100" y="477" class="card-sub">token + IP · no cloud in the loop</text>

  <rect x="352" y="406" width="250" height="96" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="372" cy="428" r="4" fill="#059669"/>
  <text x="384" y="433" class="card-title" fill="#065f46">Mijia Cloud
    <tspan font-size="9.5" font-weight="600" fill="#34d399"> built-in</tspan>
  </text>
  <text x="372" y="457" class="card-sub">Xiaomi Cloud · MIoT-Spec</text>
  <text x="372" y="477" class="card-sub">OAuth · hub sub-devices</text>

  <rect x="624" y="406" width="250" height="96" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="644" cy="428" r="4" fill="#059669"/>
  <text x="656" y="433" class="card-title" fill="#065f46">Treeow
    <tspan font-size="9.5" font-weight="600" fill="#34d399"> built-in</tspan>
  </text>
  <text x="644" y="457" class="card-sub">Treeow Cloud API</text>
  <text x="644" y="477" class="card-sub">purifier attributes</text>

  <rect x="896" y="406" width="250" height="96" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-dasharray="6 4"/>
  <circle cx="916" cy="428" r="4" fill="#7c3aed"/>
  <text x="928" y="433" class="card-title" fill="#5b21b6">Your provider
    <tspan font-size="9.5" font-weight="600" fill="#a78bfa"> plugin</tspan>
  </text>
  <text x="916" y="457" class="card-sub">any protocol you like</text>
  <text x="916" y="477" class="card-sub">entry point · no core changes</text>

  <!-- External services -->
  <line x1="205" y1="502" x2="205" y2="586" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="477" y1="502" x2="477" y2="586" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="749" y1="502" x2="749" y2="586" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1021" y1="502" x2="1021" y2="586" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="594" width="250" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="100" y="622" class="card-title" font-size="13" fill="#0f172a">Mijia Wi-Fi devices</text>
  <text x="100" y="644" class="card-sub">same LAN · UDP 54321</text>

  <rect x="352" y="594" width="250" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="372" y="622" class="card-title" font-size="13" fill="#0f172a">Xiaomi Cloud</text>
  <text x="372" y="644" class="card-sub">MIoT-Spec · OAuth</text>

  <rect x="624" y="594" width="250" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="644" y="622" class="card-title" font-size="13" fill="#0f172a">Treeow Cloud</text>
  <text x="644" y="644" class="card-sub">HTTPS API</text>

  <rect x="896" y="594" width="250" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="916" y="622" class="card-title" font-size="13" fill="#0f172a">Your service</text>
  <text x="916" y="644" class="card-sub">whatever your plugin speaks</text>

  <line x1="40" y1="692" x2="1120" y2="692" stroke="#e2e8f0"/>
  <text x="40" y="718" class="foot">The HomeKit layer only sees <tspan font-weight="600" fill="#0f172a">DeviceKind + Capability</tspan>. Add or swap a provider without touching bridge or accessory code.</text>
</svg>
